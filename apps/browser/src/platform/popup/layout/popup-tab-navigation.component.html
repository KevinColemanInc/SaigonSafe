<nav class="tw-bg-background tw-border-0 tw-border-b tw-border-secondary-300 tw-border-solid tw-shrink-0">
  <div class="tw-max-w-screen-sm tw-mx-auto">
    <ul class="tw-flex tw-flex-1 tw-mb-0 tw-p-1.5 bit-compact:tw-p-1 tw-gap-1">
      <li *ngFor="let button of navButtons" class="tw-flex-1 tw-list-none tw-relative">
        <button
          class="tw-w-full tw-flex tw-items-center tw-justify-center tw-gap-1.5 tw-px-2 tw-py-2 bit-compact:tw-px-1.5 bit-compact:tw-py-1.5 tw-bg-transparent tw-no-underline hover:tw-no-underline tw-group/tab-nav-btn hover:tw-bg-hover-default tw-border tw-border-solid tw-border-transparent tw-rounded-xl focus-visible:tw-border-primary-600"
          [ngClass]="
            rla.isActive
              ? 'tw-font-medium tw-text-primary-600 tw-bg-primary-100'
              : 'tw-text-muted'
          "
          title="{{ button.label | i18n }}"
          [routerLink]="button.page"
          [appA11yTitle]="buttonTitle(button)"
          routerLinkActive
          #rla="routerLinkActive"
          ariaCurrentWhenActive="page"
          type="button"
          role="link"
        >
          <bit-svg
            [content]="rla.isActive ? button.iconActive : button.icon"
            aria-hidden="true"
            class="tw-leading-3 tw-shrink-0"
          ></bit-svg>
          <span class="tw-text-sm tw-truncate tw-max-w-full">
            {{ button.label | i18n }}
          </span>
        </button>
        <div *ngIf="button.showBerry" class="tw-absolute tw-top-1 tw-right-[calc(50%-2.25rem)]">
          <bit-berry type="status" variant="danger"></bit-berry>
        </div>
      </li>
    </ul>
  </div>
</nav>

<div
  class="tw-min-h-0 tw-flex-1 tw-overflow-y-auto [&>*]:tw-h-full [&>*]:tw-overflow-y-auto"
  tabindex="0"
>
  <ng-content></ng-content>
</div>
