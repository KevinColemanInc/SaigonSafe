name: OSS Boundary

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  boundary:
    runs-on: ubuntu-22.04

    steps:
      - name: Check out repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          cache: "npm"
          cache-dependency-path: "**/package-lock.json"
          node-version-file: ".nvmrc"

      - name: Install
        run: npm ci

      - name: Enforce OSS boundary
        run: npm run lint:oss-boundary

      - name: Test OSS boundary guardrails
        run: npm run test:oss-boundary
